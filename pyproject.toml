[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primp-patch"
version = "0.2.0"
description = "Runtime HTTP-layer replacement: route requests/urllib3/http.client/urllib through primp for browser-grade anti-bot fingerprinting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vex1023" }]
keywords = ["primp", "requests", "urllib", "anti-bot", "http", "impersonate", "patch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "primp>=0.10",
]

[project.scripts]
pcurl = "primp_patch.curl:main"

[project.optional-dependencies]
requests = ["requests>=2.20"]
urllib3 = ["urllib3>=1.26"]
all = ["requests>=2.20", "urllib3>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/vex1023/primp-patch"
